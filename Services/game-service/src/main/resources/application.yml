spring:
  application:
    name: game-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/drawgame_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  grpc:
    server:
      port: ${GRPC_PORT:9092}

grpc:
  client:
    room-service:
      host: ${ROOM_SERVICE_HOST:localhost}
      port: ${ROOM_SERVICE_PORT:9091}

management:
  endpoints:
    web:
      exposure:
        include: health,info
