spring:
  application:
    name: realtime-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

grpc:
  client:
    room-service:
      host: ${ROOM_SERVICE_HOST:localhost}
      port: ${ROOM_SERVICE_PORT:9091}
    game-service:
      host: ${GAME_SERVICE_HOST:localhost}
      port: ${GAME_SERVICE_PORT:9092}
    chat-service:
      host: ${CHAT_SERVICE_HOST:localhost}
      port: ${CHAT_SERVICE_PORT:9093}

# TV3: unique ID for this gateway instance, used for Redis Pub/Sub self-echo prevention
gateway:
  instance-id: ${GATEWAY_INSTANCE_ID:gateway-default}

management:
  endpoints:
    web:
      exposure:
        include: health,info
