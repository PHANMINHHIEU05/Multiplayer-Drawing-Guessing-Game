<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dopamine - Play &amp; Draw (Landing &amp; Lobby)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                "primary": "#1E88E5",
                "primary-container": "#0077ce",
                "secondary": "#7C3AED",
                "secondary-container": "#8a4cfc",
                "tertiary": "#FBBF24",
                "accent-pink": "#EC4899",
                "accent-cyan": "#22D3EE",
            },
            fontFamily: {
                "headline": ["Bricolage Grotesque", "sans-serif"],
                "body": ["Plus Jakarta Sans", "sans-serif"]
            }
        }
    }
}
</script>
<style>
    .glass-panel {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 2px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 12px 36px 0 rgba(30, 136, 229, 0.18);
    }
    
    .bouncy-btn {
        position: relative;
        transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        transform-style: preserve-3d;
    }
    
    .bouncy-btn:hover {
        transform: translateY(-2px);
    }

    .bouncy-btn:active {
        transform: translateY(4px);
    }

    .bg-gradient-mesh {
        background-color: #1E88E5;
        background-image: 
            radial-gradient(at 10% 20%, #38BDF8 0px, transparent 50%),
            radial-gradient(at 90% 10%, #818CF8 0px, transparent 50%),
            radial-gradient(at 50% 80%, #60A5FA 0px, transparent 50%),
            radial-gradient(at 90% 90%, #A78BFA 0px, transparent 50%);
    }
    
    /* Intro Paint Reveal Overlay */
    #intro-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0F172A;
        transition: opacity 0.8s ease-out;
    }
    .fade-out {
        opacity: 0;
        pointer-events: none;
    }

    /* 3D Bubbly Logo Style */
    .bubbly-logo {
        font-family: 'Bricolage Grotesque', sans-serif;
        font-weight: 800;
        background: linear-gradient(180deg, #FDE047 0%, #F59E0B 50%, #EF4444 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 6px 0 #1E293B) drop-shadow(0 10px 14px rgba(0,0,0,0.3));
        letter-spacing: 1px;
    }
</style>
</head>
<body class="bg-gradient-mesh min-h-screen text-slate-800 overflow-x-hidden font-body flex flex-col justify-between">

<!-- Paint Splash Opening Reveal Animation Overlay -->
<div id="intro-overlay">
    <canvas id="paint-splash-canvas" class="w-full h-full"></canvas>
    <div id="skip-btn" class="absolute bottom-8 text-white/70 text-sm font-semibold bg-white/10 px-4 py-2 rounded-full cursor-pointer hover:bg-white/20">Bấm để bỏ qua Intro ⏩</div>
</div>

<!-- Header -->
<header class="w-full max-w-7xl mx-auto flex justify-between items-center px-6 py-4 z-40">
    <div class="flex items-center gap-3">
        <span class="text-3xl animate-bounce">🎨</span>
        <h1 class="text-3xl font-extrabold text-white tracking-tight drop-shadow-md">Dopamine</h1>
    </div>
    <div class="flex items-center gap-3">
        <button class="bg-white/20 hover:bg-white/30 text-white p-2.5 rounded-2xl backdrop-blur-md transition-all shadow-md">
            <span class="material-symbols-outlined text-xl">volume_up</span>
        </button>
        <button class="bg-white/20 hover:bg-white/30 text-white p-2.5 rounded-2xl backdrop-blur-md transition-all shadow-md">
            <span class="material-symbols-outlined text-xl">help</span>
        </button>
        <button class="bg-white/20 hover:bg-white/30 text-white px-3 py-2 rounded-2xl backdrop-blur-md font-bold text-sm transition-all shadow-md flex items-center gap-1.5">
            <span class="material-symbols-outlined text-lg">language</span> Tiếng Việt
        </button>
    </div>
</header>

<!-- Main Container -->
<main class="w-full max-w-5xl mx-auto px-4 py-6 flex-1 flex flex-col items-center justify-center gap-8">
    
    <!-- 3D Bubbly Logo Centerpiece -->
    <div class="text-center group">
        <div class="inline-block relative">
            <h2 class="text-6xl md:text-8xl bubbly-logo transform group-hover:scale-105 transition-transform duration-300">
                Dopamine<span class="text-sky-300">.io</span>
            </h2>
            <div class="absolute -top-3 -right-6 text-3xl rotate-12">🖌️</div>
        </div>
        <p class="text-white font-bold text-lg md:text-xl drop-shadow-md mt-2">
            Game Vẽ & Đoán Từ Đầy Phấn Khích Cùng Bạn Bè! ⚡
        </p>
    </div>

    <!-- Main Game Card -->
    <div class="w-full grid grid-cols-1 md:grid-cols-12 gap-6">
        
        <!-- Left: Player Profile & Avatar Setup -->
        <div class="md:col-span-4 glass-panel rounded-3xl p-6 flex flex-col items-center justify-between shadow-2xl relative">
            <div class="w-full text-center">
                <span class="text-xs uppercase font-extrabold tracking-wider text-sky-600 bg-sky-100 px-3 py-1 rounded-full">
                    Hồ Sơ Của Bạn
                </span>
                
                <!-- Avatar Preview -->
                <div class="relative w-28 h-28 mx-auto my-4 cursor-pointer group">
                    <img id="avatar-img" class="w-full h-full rounded-full border-4 border-white shadow-xl bg-amber-200 object-cover transform group-hover:scale-105 transition-transform" 
                         src="https://api.dicebear.com/7.x/bottts/svg?seed=Dopamine" alt="Avatar"/>
                    <button class="absolute bottom-0 right-0 bg-secondary text-white p-2 rounded-full shadow-lg hover:scale-110 transition-transform">
                        <span class="material-symbols-outlined text-sm">refresh</span>
                    </button>
                </div>

                <!-- Username Input -->
                <input id="username-input" class="w-full text-center font-bold text-lg bg-white/90 border-2 border-sky-300 focus:border-primary focus:ring-4 focus:ring-sky-200 rounded-2xl py-3 px-4 outline-none transition-all shadow-inner"
                       type="text" placeholder="Nhập biệt danh..." value="HọaSĩTàiBa"/>
            </div>

            <!-- Level / Stats -->
            <div class="w-full bg-sky-50/80 rounded-2xl p-3 mt-4 border border-sky-100 flex items-center justify-between text-xs font-bold text-slate-600">
                <span>🏆 Cấp độ: <strong>Lv. 15</strong></span>
                <span class="text-amber-500">⭐ 1,420 pts</span>
            </div>
        </div>

        <!-- Right: Create & Join Room Tabs -->
        <div class="md:col-span-8 glass-panel rounded-3xl p-6 shadow-2xl flex flex-col justify-between">
            
            <!-- Tabs -->
            <div class="flex p-1.5 gap-2 bg-sky-100/80 rounded-2xl mb-6">
                <button id="tab-create" class="flex-1 py-3 rounded-xl font-extrabold text-sm text-white bg-primary shadow-md transition-all" onclick="switchTab('create')">
                    ➕ TẠO PHÒNG MỚI
                </button>
                <button id="tab-join" class="flex-1 py-3 rounded-xl font-extrabold text-sm text-slate-600 hover:bg-white/60 transition-all" onclick="switchTab('join')">
                    🚪 VÀO PHÒNG
                </button>
            </div>

            <!-- TAB 1: CREATE ROOM -->
            <div id="view-create" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-extrabold text-slate-700 block mb-1">Số Người Chơi Tối Đa</label>
                        <div class="flex items-center gap-3 bg-white/80 p-2.5 rounded-xl border border-sky-200">
                            <input class="w-full accent-primary cursor-pointer" type="range" min="2" max="12" value="8" oninput="document.getElementById('player-val').innerText = this.value"/>
                            <span id="player-val" class="font-black text-primary text-sm min-w-8 text-center bg-sky-100 px-2 py-0.5 rounded-lg">8</span>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-extrabold text-slate-700 block mb-1">Thời Gian Vẽ / Vòng</label>
                        <div class="flex gap-2">
                            <button class="flex-1 py-2 rounded-xl bg-white/80 border border-sky-200 text-xs font-bold text-slate-700 hover:bg-sky-50">30s</button>
                            <button class="flex-1 py-2 rounded-xl bg-primary text-white text-xs font-bold shadow-sm">60s</button>
                            <button class="flex-1 py-2 rounded-xl bg-white/80 border border-sky-200 text-xs font-bold text-slate-700 hover:bg-sky-50">90s</button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-extrabold text-slate-700 block mb-1">Gói Từ Khóa Chủ Đề</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="p-2 rounded-xl bg-sky-100 border-2 border-primary text-primary font-bold text-xs flex items-center justify-center gap-1">
                            <span>🇻🇳</span> Tiếng Việt
                        </button>
                        <button class="p-2 rounded-xl bg-white/80 border border-sky-200 text-slate-600 font-bold text-xs flex items-center justify-center gap-1 hover:bg-sky-50">
                            <span>🎮</span> Anime & Game
                        </button>
                        <button class="p-2 rounded-xl bg-white/80 border border-sky-200 text-slate-600 font-bold text-xs flex items-center justify-center gap-1 hover:bg-sky-50">
                            <span>🍕</span> Đồ Ăn & Vật
                        </button>
                    </div>
                </div>

                <button class="bouncy-btn w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-black text-lg shadow-[0_6px_0_0_#059669] flex items-center justify-center gap-2 mt-4">
                    <span>🎮</span> BẮT ĐẦU TẠO PHÒNG
                </button>
            </div>

            <!-- TAB 2: JOIN ROOM -->
            <div id="view-join" class="space-y-4 hidden">
                <div class="text-center">
                    <label class="text-xs font-extrabold text-slate-700 block mb-2">Nhập Mã Phòng 6 Ký Tự</label>
                    <div class="flex justify-center gap-2">
                        <input class="w-11 h-14 text-center font-black text-2xl bg-white rounded-xl border-2 border-sky-300 focus:border-primary uppercase shadow-inner outline-none" maxlength="1" type="text" value="V"/>
                        <input class="w-11 h-14 text-center font-black text-2xl bg-white rounded-xl border-2 border-sky-300 focus:border-primary uppercase shadow-inner outline-none" maxlength="1" type="text" value="M"/>
                        <input class="w-11 h-14 text-center font-black text-2xl bg-white rounded-xl border-2 border-sky-300 focus:border-primary uppercase shadow-inner outline-none" maxlength="1" type="text" value="5"/>
                        <input class="w-11 h-14 text-center font-black text-2xl bg-white rounded-xl border-2 border-sky-300 focus:border-primary uppercase shadow-inner outline-none" maxlength="1" type="text" value="C"/>
                        <input class="w-11 h-14 text-center font-black text-2xl bg-white rounded-xl border-2 border-sky-300 focus:border-primary uppercase shadow-inner outline-none" maxlength="1" type="text" value="Z"/>
                        <input class="w-11 h-14 text-center font-black text-2xl bg-white rounded-xl border-2 border-sky-300 focus:border-primary uppercase shadow-inner outline-none" maxlength="1" type="text" value="D"/>
                    </div>
                    <button class="bouncy-btn px-8 py-3 bg-primary hover:bg-sky-600 text-white rounded-2xl font-black text-sm shadow-[0_4px_0_0_#1565C0] mt-3 inline-flex items-center gap-2">
                        VÀO PHÒNG NGAY <span class="material-symbols-outlined text-sm">arrow_forward</span>
                    </button>
                </div>

                <div class="border-t border-sky-200 pt-3">
                    <label class="text-xs font-extrabold text-slate-500 uppercase block mb-2">Phòng Đang Chờ</label>
                    <div class="space-y-2 max-h-36 overflow-y-auto pr-1">
                        <div class="flex items-center justify-between p-2.5 rounded-xl bg-white/80 hover:bg-white border border-sky-100 transition-all cursor-pointer">
                            <div class="flex items-center gap-2">
                                <span class="text-lg">🎪</span>
                                <div>
                                    <div class="font-bold text-xs text-slate-800">Phòng Vui Vẻ #VM5CZD</div>
                                    <div class="text-[10px] text-slate-500">Tiếng Việt • 5 Vòng</div>
                                </div>
                            </div>
                            <span class="text-xs font-extrabold text-primary bg-sky-100 px-2 py-1 rounded-lg">4/8 ng</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

</main>

<!-- Floating Mini Chat -->
<div class="fixed bottom-4 right-4 z-40">
    <button class="w-12 h-12 bg-secondary text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition-transform">
        <span class="material-symbols-outlined">chat</span>
    </button>
</div>

<!-- JS Interactions & Opening Animation -->
<script>
    // Tab switching
    function switchTab(tab) {
        const tabCreate = document.getElementById('tab-create');
        const tabJoin = document.getElementById('tab-join');
        const viewCreate = document.getElementById('view-create');
        const viewJoin = document.getElementById('view-join');

        if (tab === 'create') {
            tabCreate.className = 'flex-1 py-3 rounded-xl font-extrabold text-sm text-white bg-primary shadow-md transition-all';
            tabJoin.className = 'flex-1 py-3 rounded-xl font-extrabold text-sm text-slate-600 hover:bg-white/60 transition-all';
            viewCreate.classList.remove('hidden');
            viewJoin.classList.add('hidden');
        } else {
            tabJoin.className = 'flex-1 py-3 rounded-xl font-extrabold text-sm text-white bg-primary shadow-md transition-all';
            tabCreate.className = 'flex-1 py-3 rounded-xl font-extrabold text-sm text-slate-600 hover:bg-white/60 transition-all';
            viewJoin.classList.remove('hidden');
            viewCreate.classList.add('hidden');
        }
    }

    // Intro Animation Canvas Simulation
    const canvas = document.getElementById('paint-splash-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let progress = 0;
    function drawSplash() {
        ctx.fillStyle = '#0F172A';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Splattering paint circle
        ctx.fillStyle = '#7C3AED';
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2, progress * canvas.width * 0.7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1E88E5';
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2, Math.max(0, (progress - 0.2) * canvas.width * 0.7), 0, Math.PI * 2);
        ctx.fill();

        progress += 0.02;
        if (progress < 1.4) {
            requestAnimationFrame(drawSplash);
        } else {
            document.getElementById('intro-overlay').classList.add('fade-out');
            setTimeout(() => {
                document.getElementById('intro-overlay').style.display = 'none';
            }, 800);
        }
    }
    requestAnimationFrame(drawSplash);

    document.getElementById('skip-btn').onclick = () => {
        document.getElementById('intro-overlay').classList.add('fade-out');
        setTimeout(() => {
            document.getElementById('intro-overlay').style.display = 'none';
        }, 300);
    };
</script>

</body>
</html>
