syntax = "proto3";

package game;

option java_multiple_files = true;
option java_package = "com.drawgame.game.grpc.generated";

service GameService {

  rpc StartGame(StartGameRequest)
      returns (GameStateResponse);

  rpc GetGameState(GetGameStateRequest)
      returns (GameStateResponse);

  rpc SubmitGuess(SubmitGuessRequest)
      returns (GuessResponse);

  rpc SelectWord(SelectWordRequest)
      returns (GameStateResponse);
}

message StartGameRequest {
  string room_id = 1;
  string requester_player_id = 2;
}

message GetGameStateRequest {
  string room_id = 1;
  string viewer_player_id = 2;
}

message SubmitGuessRequest {
  string room_id = 1;
  string player_id = 2;
  string guess = 3;
}

message SelectWordRequest {
  string room_id = 1;
  string player_id = 2;
  string choice_id = 3;
}

message WordChoiceMessage {
  string choice_id = 1;
  string display_word = 2;
}

message RoundScoreDeltaMessage {
  string player_id = 1;
  string username = 2;
  int32 round_delta = 3;
  int32 total_score = 4;
}

message CorrectGuessTimingMessage {
  string player_id = 1;
  int64 elapsed_millis = 2;
}

message RoundRecapMessage {
  int32 round_number = 1;
  string drawer_id = 2;
  string answer = 3;
  repeated RoundScoreDeltaMessage score_deltas = 4;
  int32 drawer_score = 5;
  string fastest_player_id = 6;
  string fastest_username = 7;
  int64 fastest_elapsed_millis = 8;
  repeated string correct_player_ids = 9;
  repeated CorrectGuessTimingMessage correct_guess_times = 10;
}

message MatchAwardMessage {
  string type = 1;
  string label = 2;
  string player_id = 3;
  string username = 4;
  int32 value = 5;
  int64 elapsed_millis = 6;
}

message PlayerScoreMessage {
  string player_id = 1;
  string username = 2;
  int32 score = 3;
  bool has_guessed = 4;
}

message GuessResponse {
  string room_id = 1;
  string player_id = 2;
  string guess_status = 3;
  int32 score_awarded = 4;
}

message GameStateResponse {
  string room_id = 1;
  string status = 2;
  int32 current_round = 3;
  int32 total_rounds = 4;
  string drawer_id = 5;
  int64 round_started_at = 6;
  int64 round_ends_at = 7;
  repeated PlayerScoreMessage scores = 8;
  string hint = 9;
  string secret_word = 10;
  string game_id = 11;
  string round_phase = 12;
  int64 phase_started_at = 13;
  int64 phase_ends_at = 14;
  int32 round_duration_seconds = 15;
  repeated WordChoiceMessage word_choices = 16;
  RoundRecapMessage round_recap = 17;
  repeated MatchAwardMessage awards = 18;
}
